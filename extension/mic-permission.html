<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microphone Access</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #f5f5f5;
        color: #1f1f1f;
        font-family: Inter, sans-serif;

        display: grid;
        place-items: center;
      }

      .setup-card {
        width: min(340px, calc(100vw - 32px));
        padding: 16px 15px;

        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 18px;
        background: white;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.1);

        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      h1 {
        margin: 0;
        padding: 0 4px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        padding: 0 4px;
        color: rgba(0, 0, 0, 0.66);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.35;
      }

      select,
      button {
        width: 100%;
        height: 42px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 14px;
        font: inherit;
      }

      select {
        padding: 0 10px;
        background: white;
        color: #1f1f1f;
        font-size: 12px;
      }

      button {
        background: rgb(37, 37, 37);
        color: white;
        font-size: 13px;
        font-weight: 550;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main class="setup-card">
      <h1>Microphone Access</h1>
      <p id="status">Loading microphones...</p>
      <select id="micSelect"></select>
      <button id="requestBtn" type="button">Allow Microphone</button>
    </main>
    <script type="module" src="/src/mic-permission.ts"></script>
  </body>
</html>
